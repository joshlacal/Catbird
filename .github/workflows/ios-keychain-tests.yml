name: iOS Keychain Tests

on:
  pull_request:
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
  push:
    branches: [main, staging]
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
  workflow_dispatch:

jobs:
  keychain-tests:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Catbird.xcodeproj -scheme Catbird

      - name: Run the complete keychain suite
        shell: bash
        run: |
          set -euo pipefail

          expected_tests="$(grep -Ec '^[[:space:]]*func test' CatbirdTests/MLSKeychainManagerTests.swift)"
          if [[ "$expected_tests" -eq 0 ]]; then
            echo "No MLSKeychainManagerTests methods were discovered in source" >&2
            exit 1
          fi
          echo "Expecting $expected_tests MLS keychain tests"

          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }' | sed 's/[[:space:]]*$//')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          destination="platform=iOS Simulator,id=${simulator_id}"
          echo "Using destination: $destination"

          # Simulator tests intentionally use the system keychain with no
          # access-group override. The MLSKeychainManager implementation and
          # accessibility attributes remain unchanged; no test is skipped.
          set +e
          rm -rf keychain-tests.xcresult keychain-tests.log
          xcodebuild test \
            -project Catbird.xcodeproj \
            -scheme Catbird \
            -destination "$destination" \
            -resultBundlePath keychain-tests.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:CatbirdTests/MLSKeychainManagerTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee keychain-tests.log
          xcode_status=${PIPESTATUS[0]}
          set -e
          if [[ "$xcode_status" -ne 0 ]]; then
            echo "xcodebuild failed with status $xcode_status" >&2
            exit "$xcode_status"
          fi

          if [[ ! -d keychain-tests.xcresult ]]; then
            echo "xcodebuild produced no xcresult bundle" >&2
            exit 1
          fi

          xcrun xcresulttool get test-results tests \
            --path keychain-tests.xcresult \
            --compact > keychain-tests.json
          if ! jq empty keychain-tests.json; then
            echo "xcresult test report was not valid JSON" >&2
            exit 1
          fi

          # The xcresult test tree contains every planned test in the target,
          # including tests excluded by -only-testing. That is why a recursive
          # nodeType == "Test Case" count can be 139 while this suite has 26.
          # Select the discovered XCTest/Swift Testing cases by their canonical
          # nodeIdentifier instead of guessing from source text or counting
          # excluded plan nodes. Xcode 27 does not populate sourceLocation for
          # these nodes, while nodeIdentifier remains stable (Class/test()).
          suite_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and ((.nodeIdentifier? // "") | contains("MLSKeychainManagerTests/")))] | length' keychain-tests.json)"
          passed_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and ((.nodeIdentifier? // "") | contains("MLSKeychainManagerTests/")) and .result == "Passed")] | length' keychain-tests.json)"
          non_passed_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and ((.nodeIdentifier? // "") | contains("MLSKeychainManagerTests/")) and .result != "Passed")] | length' keychain-tests.json)"
          planned_tests="$(jq '[.. | objects | select(.nodeType == "Test Case")] | length' keychain-tests.json)"
          echo "Keychain suite result: selectedTestCases=$suite_tests expectedFromSource=$expected_tests plannedTargetTestCases=$planned_tests passed=$passed_tests nonPassed=$non_passed_tests"

          if [[ "$suite_tests" -ne "$expected_tests" || "$passed_tests" -ne "$expected_tests" || "$non_passed_tests" -ne 0 ]]; then
            echo "Keychain suite result evidence is incomplete or contains a non-Passed discovered Test Case" >&2
            exit 1
          fi
          echo "Keychain suite passed: $suite_tests discovered test cases; every Test Case result is exactly Passed"
