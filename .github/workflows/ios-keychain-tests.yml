name: iOS Keychain Tests

on:
  pull_request:
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
      - ".github/ci/ios-dependencies.json"
      - "scripts/verify_ios_ci_dependencies.py"
  push:
    branches: [main, staging]
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
      - ".github/ci/ios-dependencies.json"
      - "scripts/verify_ios_ci_dependencies.py"
  workflow_dispatch:

jobs:
  keychain-tests:
    # Standard GitHub-hosted arm64 image, not a paid larger or self-hosted runner.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: Catbird
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CATBIRD_MLS_LOCAL_INTEGRATION: "1"
      VALIDATION_DIR: ${{ github.workspace }}/keychain-validation
    permissions:
      contents: read

    steps:
      - name: Checkout Catbird
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: Catbird
          persist-credentials: false

      - name: Read immutable sibling revisions
        id: dependencies
        run: python3 scripts/verify_ios_ci_dependencies.py manifest >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Petrel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: joshlacal/Petrel
          ref: ${{ steps.dependencies.outputs.petrel_revision }}
          path: Petrel
          persist-credentials: false

      - name: Checkout pinned PetrelCatbird
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: joshlacal/PetrelCatbird
          ref: ${{ steps.dependencies.outputs.petrelcatbird_revision }}
          path: PetrelCatbird
          persist-credentials: false

      - name: Checkout pinned CatbirdMLSCore
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: joshlacal/CatbirdMLSCore
          ref: ${{ steps.dependencies.outputs.catbirdmlscore_revision }}
          path: CatbirdMLSCore
          persist-credentials: false

      - name: Verify Xcode and pinned source provenance
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_DIR"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$VALIDATION_DIR/xcode-version.txt"
          grep -Fx 'Xcode 27.1' "$VALIDATION_DIR/xcode-version.txt"
          grep -Fx 'Build version 27A9275' "$VALIDATION_DIR/xcode-version.txt"
          xcrun swift --version > "$VALIDATION_DIR/swift-version.txt"
          sw_vers > "$VALIDATION_DIR/macos-version.txt"
          uname -m > "$VALIDATION_DIR/architecture.txt"
          python3 scripts/verify_ios_ci_dependencies.py checkouts --reports "$VALIDATION_DIR"

      - name: Install the Xcode Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Resolve and verify Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Catbird.xcodeproj -scheme Catbird \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$VALIDATION_DIR/resolve.log"
          python3 scripts/verify_ios_ci_dependencies.py resolved \
            --reports "$VALIDATION_DIR" --source-packages "$RUNNER_TEMP/SourcePackages"

      - name: Run the keychain, native MLS and Circle suites
        shell: bash
        run: |
          set -euo pipefail

          # Count the Swift Testing cases each selected suite declares, so the
          # xcresult check below fails if a suite silently runs fewer tests.
          # count_tests FILE [STRUCT] counts @Test lines in FILE, or only in
          # STRUCT's body when the file holds several suites.
          count_tests() {
            if [[ $# -eq 1 ]]; then
              grep -Ec '^[[:space:]]*@Test([ (]|$)' "$1" || true
            else
              awk -v s="struct $2 " '
                index($0, s) { on = 1; next }
                on && /^@Suite/ { on = 0 }
                on && /^[[:space:]]*@Test([ (]|$)/ { n++ }
                END { print n + 0 }' "$1"
            fi
          }

          keychain_suites=(KeychainAccessGroupPrefixCacheTests GatewaySessionRejectionTests)
          expected_tests=0
          for suite in "${keychain_suites[@]}"; do
            n="$(count_tests "CatbirdTests/$suite.swift")"
            if [[ "$n" -eq 0 ]]; then
              echo "No @Test cases were discovered in CatbirdTests/$suite.swift" >&2
              exit 1
            fi
            expected_tests=$((expected_tests + n))
          done
          echo "Expecting $expected_tests keychain tests across ${keychain_suites[*]}"

          native_suite=CrossLanguageRealFFITests
          native_expected_tests="$(count_tests CatbirdTests/CrossLanguageFixtureTests.swift "$native_suite")"
          if [[ "$native_expected_tests" -eq 0 ]]; then
            echo "No @Test cases were discovered in $native_suite" >&2
            exit 1
          fi
          echo "Expecting $native_expected_tests native MLS tests in $native_suite"

          # Circles (end-to-end encrypted posts) suites. Swift Testing suites
          # can span several files through extensions, so these are checked
          # per suite at run time (each must run at least one case, and every
          # case must pass) rather than counted from source.
          circle_suites=(
            CircleAccountErasureTests HostedAccountDeletionCirclesTests
            CircleConfigurationTests CircleCoordinatorCacheTests
            CircleDestinationTests CircleDraftDestinationTests
            CircleFeedCacheIsolationTests CircleFeedModelTests CircleFixWave2Tests
            CircleKeyManagerTests CircleKeyStoreTests CircleKeychainQueryTests
            CircleManagementViewModelTests EncryptedCircleManagementTests
            CircleMediaLoaderTests CircleModerationTests CircleNotificationTests
            CirclePostOpenerTests CirclePostSealerTests CircleReportDisclosureTests
            CircleRawWriteTests CircleServiceTests
          )
          for suite in "${circle_suites[@]}"; do
            if ! grep -REqw "(struct|class|extension) $suite" CatbirdTests; then
              echo "Circle suite $suite is not declared in CatbirdTests" >&2
              exit 1
            fi
          done
          # Live account-switch tests drive the shared AppStateManager, the
          # real keychain and a network switch to bsky.social; on a hosted
          # runner they hang. They are skipped here and allowed below by exact id.
          circle_skipped=(
            "CircleNotificationTests/accountSwitchAliceBobAliceRebuildsFreshCircleModels()"
            "CircleNotificationTests/forcedDatabaseDrainFailureDuringSwitchRecoversSafely()"
          )
          circle_only_testing=()
          for suite in "${circle_suites[@]}"; do
            circle_only_testing+=("-only-testing:CatbirdTests/$suite")
          done
          for test_id in "${circle_skipped[@]}"; do
            circle_only_testing+=("-skip-testing:CatbirdTests/$test_id")
          done
          echo "Running ${#circle_suites[@]} Circle suites"

          xcrun simctl list devices available -j > "$VALIDATION_DIR/simulators.json"
          simulator_id="$(jq -r '[.devices | to_entries[] | select(.key == "com.apple.CoreSimulator.SimRuntime.iOS-27-0") | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid // empty' "$VALIDATION_DIR/simulators.json")"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iOS 27.0 iPhone simulator found" >&2
            exit 1
          fi
          destination="platform=iOS Simulator,id=${simulator_id}"
          echo "Using destination: $destination"
          printf '%s\n' "$destination" > "$VALIDATION_DIR/destination.txt"

          # Keep the application's entitlements and ad-hoc signing: disabling
          # signing changes simulator keychain/App Group behavior. This needs
          # no signing certificate or provisioning-profile secret.
          set +e
          xcodebuild test \
            -project Catbird.xcodeproj \
            -scheme Catbird \
            -destination "$destination" \
            -resultBundlePath "$VALIDATION_DIR/keychain-tests.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            -jobs 3 \
            -parallel-testing-enabled NO \
            -only-testing:CatbirdTests/KeychainAccessGroupPrefixCacheTests \
            -only-testing:CatbirdTests/GatewaySessionRejectionTests \
            -only-testing:CatbirdTests/CrossLanguageRealFFITests \
            "${circle_only_testing[@]}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            2>&1 | tee "$VALIDATION_DIR/keychain-tests.log"
          xcode_status=${PIPESTATUS[0]}
          set -e
          if [[ "$xcode_status" -ne 0 ]]; then
            echo "xcodebuild failed with status $xcode_status" >&2
            exit "$xcode_status"
          fi

          if [[ ! -d "$VALIDATION_DIR/keychain-tests.xcresult" ]]; then
            echo "xcodebuild produced no xcresult bundle" >&2
            exit 1
          fi

          xcrun xcresulttool get test-results tests \
            --path "$VALIDATION_DIR/keychain-tests.xcresult" \
            --compact > "$VALIDATION_DIR/keychain-tests.json"
          if ! jq empty "$VALIDATION_DIR/keychain-tests.json"; then
            echo "xcresult test report was not valid JSON" >&2
            exit 1
          fi

          # The xcresult test tree contains every planned test in the target,
          # including tests excluded by -only-testing, so a recursive
          # nodeType == "Test Case" count covers the whole target. Select the
          # cases by their canonical nodeIdentifier prefix (Suite/test())
          # instead. Xcode 27 does not populate sourceLocation for these nodes.
          report="$VALIDATION_DIR/keychain-tests.json"
          # count_cases PREFIX_JSON_ARRAY [passed|failed]
          count_cases() {
            local filter='.nodeType == "Test Case" and ((.nodeIdentifier? // "") as $id | any($p[]; . as $x | $id | startswith($x)))'
            case "${2:-}" in
              passed) filter="$filter and .result == \"Passed\"" ;;
              failed) filter="$filter and .result != \"Passed\"" ;;
            esac
            jq --argjson p "$1" "[.. | objects | select($filter)] | length" "$report"
          }

          keychain_prefixes="$(printf '%s/\n' "${keychain_suites[@]}" | jq -R . | jq -sc .)"
          suite_tests="$(count_cases "$keychain_prefixes")"
          passed_tests="$(count_cases "$keychain_prefixes" passed)"
          non_passed_tests="$(count_cases "$keychain_prefixes" failed)"
          planned_tests="$(jq '[.. | objects | select(.nodeType == "Test Case")] | length' "$report")"
          echo "Keychain suite result: selectedTestCases=$suite_tests expectedFromSource=$expected_tests plannedTargetTestCases=$planned_tests passed=$passed_tests nonPassed=$non_passed_tests"

          if [[ "$suite_tests" -ne "$expected_tests" || "$passed_tests" -ne "$expected_tests" || "$non_passed_tests" -ne 0 ]]; then
            echo "Keychain suite result evidence is incomplete or contains a non-Passed discovered Test Case" >&2
            exit 1
          fi
          echo "Keychain suites passed: $suite_tests discovered test cases; every Test Case result is exactly Passed"

          # These app-host tests load the linked native CatbirdMLS library and
          # call it through the generated UniFFI bindings, so a broken or
          # mismatched xcframework fails here.
          native_prefixes="[\"$native_suite/\"]"
          native_tests="$(count_cases "$native_prefixes")"
          native_passed_tests="$(count_cases "$native_prefixes" passed)"
          if [[ "$native_tests" -ne "$native_expected_tests" || "$native_passed_tests" -ne "$native_expected_tests" ]]; then
            echo "Native MLS test evidence is incomplete or non-Passed: expected=$native_expected_tests discovered=$native_tests passed=$native_passed_tests" >&2
            exit 1
          fi
          echo "Native MLS tests passed in the signed application host: $native_passed_tests"

          for suite in "${circle_suites[@]}"; do
            n="$(count_cases "[\"$suite/\"]")"
            if [[ "$n" -eq 0 ]]; then
              echo "Circle suite $suite ran no test cases" >&2
              exit 1
            fi
          done
          circle_prefixes="$(printf '%s/\n' "${circle_suites[@]}" | jq -R . | jq -sc .)"
          circle_tests="$(count_cases "$circle_prefixes")"
          circle_passed="$(count_cases "$circle_prefixes" passed)"
          circle_skip_ids="$(printf '%s\n' "${circle_skipped[@]}" | jq -R . | jq -sc .)"
          circle_non_passed="$(jq --argjson p "$circle_prefixes" --argjson skip "$circle_skip_ids" '
            [.. | objects | select(.nodeType == "Test Case"
              and ((.nodeIdentifier? // "") as $id | any($p[]; . as $x | $id | startswith($x)))
              and (.result != "Passed")
              and ((.nodeIdentifier? // "") as $id | ($skip | index($id)) == null))] | length' "$report")"
          circle_skipped_count=$((circle_tests - circle_passed - circle_non_passed))
          if [[ "$circle_non_passed" -ne 0 || "$circle_skipped_count" -gt "${#circle_skipped[@]}" ]]; then
            echo "Circle tests did not all pass: discovered=$circle_tests passed=$circle_passed nonPassed=$circle_non_passed" >&2
            exit 1
          fi
          echo "Circle suites passed: $circle_passed test cases across ${#circle_suites[@]} suites ($circle_skipped_count known live tests skipped)"

      - name: Preserve simulator signing evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_DIR"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Catbird.app"
          if [[ -d "$app" ]]; then
            codesign --verify --strict "$app" 2>&1 | tee "$VALIDATION_DIR/signature-verification.txt"
            codesign --display --verbose=4 "$app" 2> "$VALIDATION_DIR/signature-details.txt"
            # Simulator entitlements live in the Mach-O __entitlements section;
            # codesign --display --entitlements can correctly return an empty dict.
            xcrun otool -l "$app/Catbird" > "$VALIDATION_DIR/app-load-commands.txt"
            entitlements="$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex/Catbird.build/Debug-iphonesimulator/Catbird.build/Catbird.app-Simulated.xcent"
            if [[ -f "$entitlements" ]]; then
              cp "$entitlements" "$VALIDATION_DIR/simulator-entitlements.plist"
            fi
          fi

      - name: Preserve keychain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-keychain-validation
          path: ${{ github.workspace }}/keychain-validation/
          if-no-files-found: error
