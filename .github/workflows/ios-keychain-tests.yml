name: iOS Keychain Tests

on:
  pull_request:
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
  push:
    branches: [main, staging]
    paths:
      - "Catbird/**"
      - "CatbirdTests/**"
      - "Catbird.xcodeproj/**"
      - "Package.resolved"
      - ".github/workflows/ios-keychain-tests.yml"
  workflow_dispatch:

jobs:
  keychain-tests:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Catbird.xcodeproj -scheme Catbird

      - name: Run the complete keychain suite
        shell: bash
        run: |
          set -euo pipefail

          expected_tests="$(grep -Ec '^[[:space:]]*func test' CatbirdTests/MLSKeychainManagerTests.swift)"
          if [[ "$expected_tests" -eq 0 ]]; then
            echo "No MLSKeychainManagerTests methods were discovered in source" >&2
            exit 1
          fi
          echo "Expecting $expected_tests MLS keychain tests"

          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $1; exit }' | sed 's/[[:space:]]*$//')"
          if [[ -z "$simulator_name" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          destination="platform=iOS Simulator,name=${simulator_name},OS=latest"
          echo "Using destination: $destination"

          # Simulator tests intentionally use the system keychain with no
          # access-group override. The MLSKeychainManager implementation and
          # accessibility attributes remain unchanged; no test is skipped.
          set +e
          rm -rf keychain-tests.xcresult keychain-tests.log
          xcodebuild test \
            -project Catbird.xcodeproj \
            -scheme Catbird \
            -destination "$destination" \
            -resultBundlePath keychain-tests.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:CatbirdTests/MLSKeychainManagerTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee keychain-tests.log
          xcode_status=${PIPESTATUS[0]}
          set -e
          if [[ "$xcode_status" -ne 0 ]]; then
            echo "xcodebuild failed with status $xcode_status" >&2
            exit "$xcode_status"
          fi

          if [[ ! -d keychain-tests.xcresult ]]; then
            echo "xcodebuild produced no xcresult bundle" >&2
            exit 1
          fi

          xcrun xcresulttool get test-results tests \
            --path keychain-tests.xcresult \
            --compact > keychain-tests.json
          if ! jq empty keychain-tests.json; then
            echo "xcresult test report was not valid JSON" >&2
            exit 1
          fi

          suite_tests="$(jq '[.. | objects | select(.nodeType == "Test Case")] | length' keychain-tests.json)"
          missing_results="$(jq '[.. | objects | select(.nodeType == "Test Case" and (.result == null))] | length' keychain-tests.json)"
          failed_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and .result == "Failed")] | length' keychain-tests.json)"
          skipped_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and .result == "Skipped")] | length' keychain-tests.json)"
          expected_failure_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and .result == "Expected Failure")] | length' keychain-tests.json)"
          unknown_tests="$(jq '[.. | objects | select(.nodeType == "Test Case" and .result == "unknown")] | length' keychain-tests.json)"
          echo "Keychain suite result: testCases=$suite_tests expectedFromSource=$expected_tests failed=$failed_tests skipped=$skipped_tests expectedFailures=$expected_failure_tests unknown=$unknown_tests"

          if [[ "$suite_tests" -ne "$expected_tests" || "$missing_results" -ne 0 || "$failed_tests" -ne 0 || "$skipped_tests" -ne 0 || "$expected_failure_tests" -ne 0 || "$unknown_tests" -ne 0 ]]; then
            echo "Keychain suite result evidence is incomplete or non-green" >&2
            exit 1
          fi
          echo "Keychain suite passed: $suite_tests test cases; no failures, skips, expected failures, or unknown results"
